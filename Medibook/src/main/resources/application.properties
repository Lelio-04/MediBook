# --- Informazioni Applicazione ---
spring.application.name=Medibook
server.port=8080

# --- Configurazione Database MySQL (ODD: MySQL 8.0) ---
# URL: Connessione al DB 'medibook' sulla porta standard 3306
# Se il database non esiste, crea prima uno schema vuoto chiamato 'medibook' su MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medibook?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Driver JDBC (ODD: MySQL Connector/J) [cite: 38]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CREDENZIALI (DA MODIFICARE) ---
spring.datasource.username=root
spring.datasource.password=admin

# --- Configurazione JPA / Hibernate (Persistenza) ---

# 'update': Crea le tabelle se mancano, aggiorna le colonne se cambi il codice,
# MA mantiene i dati salvati quando riavvii l'app.
spring.jpa.hibernate.ddl-auto=create-drop
# --- Debugging ---
# Mostra le query SQL nella console (utile per verificare cosa fa il backend)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp